<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima Mazatlán</title>
  <meta name="description" content="El clima actual, por hora y de la semana en Mazatlán o en cualquier ciudad.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos/estilos.css">
  <!-- Aplica el tema guardado antes de pintar, para evitar parpadeo -->
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="header container">
    <a class="logo" href="./">Clima<span>.</span></a>
    <button id="theme-btn" class="icon-btn" aria-label="Cambiar tema claro u oscuro">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="container">
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>

    <section id="weather" class="weather" aria-busy="true">
      <article id="now" class="card now">
        <div>
          <h1 id="place">Mazatlán</h1>
          <p id="region" class="muted"></p>
          <p id="date" class="muted"></p>
        </div>
        <div class="now-main">
          <span id="now-icon" class="now-icon" aria-hidden="true"></span>
          <p class="now-temp"><span id="now-temp">--</span>°</p>
        </div>
        <p id="now-text" class="now-text"></p>
        <dl class="stats">
          <div><dt>Sensación</dt><dd id="feels">--</dd></div>
          <div><dt>Humedad</dt><dd id="humidity">--</dd></div>
          <div><dt>Viento</dt><dd id="wind">--</dd></div>
        </dl>
      </article>

      <article class="card">
        <h2>Próximas 24 horas</h2>
        <ol id="hourly" class="hourly"></ol>
      </article>

      <article class="card">
        <h2>Próximos 7 días</h2>
        <ol id="daily" class="daily"></ol>
      </article>
    </section>

  </main>

  <footer class="footer container">
    <p>Datos del clima de <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0) · Hecho por Eduardo Cruz Oleta · <a href="https://portafolio-eduardocruz.netlify.app" target="_blank" rel="noopener">Portafolio</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
