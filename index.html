<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima Mazatlán</title>
  <meta name="description" content="El clima actual, por hora y de la semana en Mazatlán o en cualquier ciudad.">
  <meta name="theme-color" content="#0369a1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Outfit:wght@200;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos/estilos.css">
  <!-- Aplica el tema guardado antes de pintar, para evitar parpadeo -->
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body data-sky="clear">
  <!-- Íconos SVG: se dibujan una vez aquí y se reutilizan con <use href="#i-..."> -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-sun" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
      </linearGradient>
      <linearGradient id="g-moon" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f1f5ff"/><stop offset="1" stop-color="#a5b4fc"/>
      </linearGradient>
      <path id="cloud-shape" d="M20 50A9 9 0 0 1 18.6 32.1A13 13 0 0 1 43.5 27A11.5 11.5 0 0 1 44 50Z"/>
      <g id="sun-shape">
        <g stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round">
          <path d="M32 6v5M32 53v5M6 32h5M53 32h5M13.6 13.6l3.5 3.5M46.9 46.9l3.5 3.5M13.6 50.4l3.5-3.5M46.9 17.1l3.5-3.5"/>
        </g>
        <circle cx="32" cy="32" r="13" fill="url(#g-sun)"/>
      </g>
      <path id="moon-shape" d="M38 10a22 22 0 1 0 16 33A18 18 0 0 1 38 10z" fill="url(#g-moon)"/>
    </defs>

    <!-- Clima (64 × 64) -->
    <symbol id="i-sun" viewBox="0 0 64 64"><use href="#sun-shape"/></symbol>
    <symbol id="i-moon" viewBox="0 0 64 64">
      <use href="#moon-shape"/>
      <circle cx="50" cy="14" r="2" fill="#fde68a"/><circle cx="56" cy="26" r="1.4" fill="#fde68a"/>
    </symbol>
    <symbol id="i-cloud" viewBox="0 0 64 64"><use href="#cloud-shape" style="fill: var(--cloud)"/></symbol>
    <symbol id="i-cloud-sun" viewBox="0 0 64 64">
      <use href="#sun-shape" transform="translate(4 2) scale(.62)"/>
      <use href="#cloud-shape" transform="translate(8 4) scale(.9)" style="fill: var(--cloud)"/>
    </symbol>
    <symbol id="i-cloud-moon" viewBox="0 0 64 64">
      <use href="#moon-shape" transform="translate(2 0) scale(.6)"/>
      <use href="#cloud-shape" transform="translate(8 4) scale(.9)" style="fill: var(--cloud)"/>
    </symbol>
    <symbol id="i-fog" viewBox="0 0 64 64">
      <use href="#cloud-shape" transform="translate(0 -8)" style="fill: var(--cloud)"/>
      <path d="M14 50h36M20 57h28" stroke-width="3.5" stroke-linecap="round" style="stroke: var(--cloud-dark)"/>
    </symbol>
    <symbol id="i-drizzle" viewBox="0 0 64 64">
      <use href="#cloud-shape" transform="translate(0 -8)" style="fill: var(--cloud-dark)"/>
      <path d="M24 48l-1.5 4M32 50l-1.5 4M40 48l-1.5 4" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-rain" viewBox="0 0 64 64">
      <use href="#cloud-shape" transform="translate(0 -8)" style="fill: var(--cloud-dark)"/>
      <path d="M24 48l-3 8M32 49l-3 8M40 48l-3 8" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-snow" viewBox="0 0 64 64">
      <use href="#cloud-shape" transform="translate(0 -8)" style="fill: var(--cloud)"/>
      <g fill="#7dd3fc"><circle cx="23" cy="51" r="2.6"/><circle cx="32" cy="56" r="2.6"/><circle cx="41" cy="51" r="2.6"/></g>
    </symbol>
    <symbol id="i-storm" viewBox="0 0 64 64">
      <use href="#cloud-shape" transform="translate(0 -8)" style="fill: var(--cloud-dark)"/>
      <path d="M34 42l-9 12h7l-3 9 11-14h-7l3-7z" fill="#facc15"/>
    </symbol>

    <!-- Interfaz (24 × 24, de línea) -->
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/></symbol>
    <symbol id="i-temp" viewBox="0 0 24 24"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/></symbol>
  </svg>

  <header class="header container">
    <a class="logo" href="./"><svg class="wx logo-icon" aria-hidden="true"><use href="#i-cloud-sun"/></svg>Clima<span>.</span></a>
    <button id="theme-btn" class="icon-btn" aria-label="Cambiar tema claro u oscuro">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="container">
    <form id="search" class="search" role="search">
      <label for="city" class="sr-only">Buscar ciudad</label>
      <div class="field">
        <svg aria-hidden="true"><use href="#i-search"/></svg>
        <input id="city" type="search" placeholder="Buscar ciudad" autocomplete="off" required>
      </div>
      <button class="btn" type="submit">Buscar</button>
      <button id="locate" class="icon-btn locate" type="button" aria-label="Usar mi ubicación" title="Usar mi ubicación">
        <svg aria-hidden="true"><use href="#i-pin"/></svg>
      </button>
    </form>
    <ul id="results" class="results" hidden></ul>

    <div id="message" class="message" role="status" aria-live="polite" hidden></div>

    <section id="weather" class="weather" aria-busy="true">
      <article id="now" class="card now">
        <div class="now-head">
          <h1 id="place">Mazatlán</h1>
          <p id="region" class="now-sub"></p>
          <p id="date" class="now-sub"></p>
        </div>
        <div class="now-main">
          <p class="now-temp"><span id="now-temp">--</span>°</p>
          <span id="now-icon" class="now-icon" aria-hidden="true"></span>
        </div>
        <p id="now-text" class="now-text"></p>
        <p id="now-range" class="now-sub"></p>
        <dl class="stats">
          <div><dt><svg aria-hidden="true"><use href="#i-temp"/></svg>Sensación</dt><dd id="feels">--</dd></div>
          <div><dt><svg aria-hidden="true"><use href="#i-drop"/></svg>Humedad</dt><dd id="humidity">--</dd></div>
          <div><dt><svg aria-hidden="true"><use href="#i-wind"/></svg>Viento</dt><dd id="wind">--</dd></div>
        </dl>
      </article>

      <article class="card">
        <h2>Próximas 24 horas</h2>
        <ol id="hourly" class="hourly"></ol>
      </article>

      <article class="card">
        <h2>Próximos 7 días</h2>
        <ol id="daily" class="daily"></ol>
      </article>
    </section>
  </main>

  <footer class="footer container">
    <p>Datos del clima de <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0) · Hecho por Eduardo Cruz Oleta · <a href="https://portafolio-eduardocruz.netlify.app" target="_blank" rel="noopener">Portafolio</a></p>
  </footer>

  <script src="scrips/scripts.js"></script>
</body>
</html>
